<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>408 学习打卡</title>
<style>
:root{
  --bg:#0c0c0e; --panel:#16161a; --panel2:#202026; --line:#2b2b31;
  --text:#e9e9ec; --muted:#9b9ba4; --dim:#5f5f68;
  --ok:#7fd49a; --no:#e07a7a; --amber:#e8c97a; --strong:#f2f2f4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:22px 18px 48px}
header{display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.logo{font-size:21px;font-weight:600;letter-spacing:3px;text-align:center}
.logo small{display:block;color:var(--muted);font-size:12px;font-weight:400;letter-spacing:1px;margin-top:3px}
.clock{text-align:center;width:100%}
.clock .time{font-size:46px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:2px}
.clock .date{color:var(--muted);font-size:14px;margin-top:6px;letter-spacing:1px}
.nav{display:flex;align-items:center;gap:10px;margin:16px 0 6px;flex-wrap:wrap}
.nav button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px;font-family:inherit}
.nav button:hover{background:var(--panel2)}
.nav .cur{color:var(--text);font-weight:600;min-width:150px;text-align:center;font-variant-numeric:tabular-nums}
.nav input[type=date]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:13px;color-scheme:dark}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 16px}
.stat{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{color:var(--muted);font-size:12px}
.stat .v{font-size:21px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.stat .s{color:var(--dim);font-size:12px;margin-top:3px}
.bar{height:4px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s ease}
.now-card{background:linear-gradient(140deg,#1a1a1f,#101013);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:8px}
.now-card .tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 12px;margin-bottom:12px;letter-spacing:1px}
.now-card .big{font-size:16px;line-height:1.7}
.now-card .sub{color:var(--muted);font-size:13px;margin-top:8px}
.now-card .sub b{color:var(--text);font-weight:500}
.now-card .next{color:var(--dim);font-size:12.5px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
h2{font-size:15px;font-weight:600;margin:24px 0 10px;letter-spacing:1px}
ul.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
li.task{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
li.task.dim{opacity:.55}
.range{min-width:110px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.body{flex:1;font-size:14px;line-height:1.6;min-width:0}
.body .ph{color:var(--muted);font-size:12px;margin-right:8px}
.status{font-size:12px;padding:3px 11px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status.doing{background:var(--panel2);border-color:#4a4a52;color:var(--text)}
.status.done{background:var(--ok);border-color:var(--ok);color:#0d0d0d;font-weight:600}
.status.no{background:var(--no);border-color:var(--no);color:#160b0b;font-weight:600}
.act{display:flex;gap:8px;align-items:center}
.act button{border-radius:9px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.act button.done-btn{background:var(--strong);color:#101013;border-color:var(--strong);font-weight:600}
.act button.no-btn{background:transparent;color:var(--muted)}
.act button.tiny{background:none;border:none;color:var(--muted);font-size:12px;padding:6px 4px;text-decoration:underline;cursor:pointer}
.empty{color:var(--muted);font-size:14px;padding:18px 4px;line-height:1.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;font-family:inherit;color:var(--text);transition:transform .1s ease}
.cell:hover{transform:translateY(-1px)}
.cell .d{color:var(--muted);font-size:11px}
.cell .c{font-variant-numeric:tabular-nums;margin-top:4px;font-size:12px}
.cell.full{background:#1c3a25;border-color:#2f5c3b;color:#d7efdd}
.cell.part{background:#3a3017;border-color:#5c4b1f;color:#f2e2b6}
.cell.rest{background:#121215;color:var(--dim)}
.cell.cur{outline:2px solid var(--strong)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:12px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
ul.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
li.log-row{display:flex;gap:12px;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px}
.log-time{color:var(--muted);font-variant-numeric:tabular-nums;min-width:120px;font-size:12px}
.log-txt{flex:1;min-width:0;line-height:1.5}
.log-ok{color:var(--ok);font-weight:600}
.log-no{color:var(--no);font-weight:600}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.tools button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 16px;cursor:pointer;font-size:13px;font-family:inherit}
.tools button:hover{background:var(--panel2)}
footer{margin-top:30px;color:var(--dim);font-size:12px;text-align:center;line-height:1.8}
@media (max-width:600px){
  header{align-items:center}
  .clock{text-align:center}
  li.task{flex-wrap:wrap}
  .range{min-width:0}
  .act{margin-left:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">408 学习打卡<small>王道408网课 · 每日打卡</small></div>
    <div class="clock">
      <div class="time" id="time">--:--:--</div>
      <div class="date" id="date">----</div>
    </div>
  </header>

  <div class="nav">
    <button type="button" id="prevDay">← 前一天</button>
    <span class="cur" id="curDay">----</span>
    <button type="button" id="nextDay">后一天 →</button>
    <input type="date" id="datePick" aria-label="选择日期">
    <button type="button" id="todayBtn">今天</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">今日完成</div><div class="v" id="stDone">0/0</div><div class="s" id="stTodo"></div><div class="bar"><i id="barDone" style="width:0%"></i></div></div>
    <div class="stat"><div class="k">总进度</div><div class="v" id="stTotal">0/0</div><div class="s" id="stTotalPct"></div></div>
    <div class="stat"><div class="k">累计完成</div><div class="v" id="stCum">0</div><div class="s">全部任务打卡次数</div></div>
    <div class="stat"><div class="k">连续打卡</div><div class="v" id="stStreak">0 天</div><div class="s">每日全部完成</div></div>
  </div>

  <div class="now-card" aria-live="polite">
    <span class="tag" id="nowTag">当前</span>
    <div class="big" id="nowText">加载中…</div>
    <div class="sub" id="nowSub"></div>
    <div class="next" id="nowNext"></div>
  </div>

  <h2 id="listTitle">今日任务</h2>
  <ul class="tasks" id="taskList"></ul>
  <div class="empty" id="emptyNote" hidden></div>

  <h2>打卡日历</h2>
  <div class="legend">
    <span><i style="background:var(--ok)"></i>全部完成</span>
    <span><i style="background:var(--amber)"></i>部分完成</span>
    <span><i style="background:var(--panel2)"></i>未打卡</span>
    <span><i style="background:#121215;border:1px solid var(--line)"></i>休息日</span>
  </div>
  <div class="grid" id="calGrid"></div>

  <h2>最近打卡记录</h2>
  <ul class="log" id="logList"></ul>
  <div class="empty" id="logEmpty" hidden>还没有打卡记录，完成第一个任务后这里会显示。</div>

  <div class="tools">
    <button type="button" id="exportBtn">导出打卡记录</button>
    <button type="button" id="importBtn">导入打卡记录</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>

  <footer>数据来源：王道408网课学习计划表（2026.08.29–09.28）<br>打卡记录仅保存在本浏览器，支持导出/导入备份，不会上传。</footer>
</div>

const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
const STORE_KEY = "wd408_check_v2";
const LEGACY_KEY = "wd408_check_v1";

function pad2(n){ return String(n).padStart(2,"0"); }
function dateKey(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function parseKey(k){ const p=k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function toMin(t){ const p=t.split(":").map(Number); return p[0]*60+p[1]; }
function fmtClock(d){ return pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds()); }
function fmtDateCn(d){ return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 "+WEEK[d.getDay()]; }
function evId(date, i){ return date+"-"+i; }

let marks = {};
function normalize(obj){
  const out = {};
  Object.keys(obj || {}).forEach(function(k){
    const v = obj[k];
    if (v === "done" || v === "no") out[k] = {s:v, t:null};
    else if (v && typeof v === "object" && (v.s === "done" || v.s === "no")) out[k] = {s:v.s, t:v.t || null};
  });
  return out;
}
function loadMarks(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const obj = JSON.parse(raw); return normalize(obj.marks || obj); }
  } catch(e){}
  try {
    const old = JSON.parse(localStorage.getItem(LEGACY_KEY) || "{}");
    const out = normalize(old);
    if (Object.keys(out).length) {
      localStorage.setItem(STORE_KEY, JSON.stringify({version:2, marks:out}));
      return out;
    }
  } catch(e){}
  return {};
}
function saveMarks(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify({version:2, marks:marks})); } catch(e){}
}
function pruneMarks(){
  const valid = {};
  SCHEDULE.days.forEach(function(day){
    day.events.forEach(function(_, i){ valid[evId(day.date, i)] = true; });
  });
  Object.keys(marks).forEach(function(k){ if (!valid[k]) delete marks[k]; });
}

function getDay(dateStr){ return SCHEDULE.days.find(function(d){ return d.date === dateStr; }) || null; }
function dayEvents(dateStr){ const day = getDay(dateStr); return day ? day.events : []; }
function statusOf(ev, dateStr, nowMin){
  const id = evId(dateStr, dayEvents(dateStr).indexOf(ev));
  const mk = marks[id];
  if (mk) return mk.s;
  const s = toMin(ev.start), e = toMin(ev.end);
  if (nowMin < s) return "pending";
  if (nowMin < e) return "doing";
  return "todo";
}
function phaseOf(text){
  if (text.indexOf("计组") === 0) return "计组";
  if (text.indexOf("数据结构") === 0) return "数据结构";
  if (text.indexOf("计网") === 0) return "计网";
  if (text.indexOf("自学") === 0) return "自学";
  if (text.indexOf("课后题") >= 0) return "习题";
  if (text.indexOf("真题") >= 0 || text.indexOf("错题") >= 0) return "复习";
  return "安排";
}
function statusText(s){ return {pending:"未开始", doing:"进行中", todo:"待打卡", done:"已完成", no:"未完成"}[s]; }
function dayComplete(dateStr){
  const evs = dayEvents(dateStr);
  if (!evs.length) return false;
  return evs.every(function(ev){ return marks[evId(dateStr, evs.indexOf(ev))] && marks[evId(dateStr, evs.indexOf(ev))].s === "done"; });
}
function dayDoneCount(dateStr){
  const evs = dayEvents(dateStr);
  return evs.filter(function(ev){ const m = marks[evId(dateStr, evs.indexOf(ev))]; return m && m.s === "done"; }).length;
}
function streakDays(){
  let streak = 0;
  let d = new Date();
  if (!dayComplete(dateKey(d))) d.setDate(d.getDate() - 1);
  while (dayComplete(dateKey(d))) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}

let viewDate = new Date();
const $ = function(id){ return document.getElementById(id); };

function renderNow(nowMin){
  const dateStr = dateKey(viewDate);
  const evs = dayEvents(dateStr);
  const day = getDay(dateStr);
  const tag = $("nowTag"), big = $("nowText"), sub = $("nowSub"), next = $("nowNext");
  const doing = evs.find(function(ev){ return statusOf(ev, dateStr, nowMin) === "doing"; });
  const nxt = evs.find(function(ev){ return statusOf(ev, dateStr, nowMin) === "pending"; });
  const todo = evs.filter(function(ev){ return statusOf(ev, dateStr, nowMin) === "todo"; });
  if (doing){
    tag.textContent = "正在进行";
    big.textContent = doing.text;
    sub.innerHTML = phaseOf(doing.text) + " · " + doing.start + "–" + doing.end + " · 还剩约 <b>" + (toMin(doing.end) - nowMin) + "</b> 分钟";
  } else if (nxt){
    tag.textContent = "接下来";
    big.textContent = nxt.text;
    sub.innerHTML = phaseOf(nxt.text) + " · " + nxt.start + "–" + nxt.end + " · <b>" + nxt.start + "</b> 开始";
  } else if (todo.length){
    tag.textContent = "待打卡";
    big.textContent = "有 " + todo.length + " 项安排已结束，请确认是否完成";
    sub.textContent = todo[0].start + "–" + todo[0].end + " " + todo[0].text;
  } else if (!day){
    tag.textContent = "计划外";
    big.textContent = "这一天不在计划范围内";
    sub.textContent = "计划期间：2026.08.29 – 2026.09.28";
  } else if (!evs.length){
    tag.textContent = day.remark || "休息";
    big.textContent = "今天没有安排" + (day.remark ? "（" + day.remark + "）" : "");
    sub.textContent = "好好休息，明天继续";
  } else {
    const doneCnt = dayDoneCount(dateStr);
    tag.textContent = doneCnt === evs.length ? "全部完成" : "今日结束";
    big.textContent = doneCnt === evs.length ? "今天的任务已全部完成，太棒了 🎉" : "今天的安排已全部结束";
    sub.textContent = "完成 " + doneCnt + " / " + evs.length + " 项";
  }
  const tom = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate() + 1);
  const tomEvs = dayEvents(dateKey(tom));
  next.textContent = tomEvs.length
    ? "明日预告：" + tomEvs[0].start + " " + tomEvs[0].text + (tomEvs.length > 1 ? " 等 " + tomEvs.length + " 项" : "")
    : (getDay(dateKey(tom)) ? "明日休息" : "明日不在计划内");
}

function renderTasks(nowMin){
  const dateStr = dateKey(viewDate);
  const evs = dayEvents(dateStr);
  const list = $("taskList");
  const empty = $("emptyNote");
  list.innerHTML = "";
  if (!evs.length){
    list.hidden = true;
    empty.hidden = false;
    const day = getDay(dateStr);
    empty.textContent = day && day.remark ? day.remark : "今天没有需要打卡的任务。";
    return;
  }
  list.hidden = false;
  empty.hidden = true;
  evs.forEach(function(ev, i){
    const st = statusOf(ev, dateStr, nowMin);
    const li = document.createElement("li");
    li.className = "task" + (st === "pending" ? " dim" : "");
    const range = document.createElement("span");
    range.className = "range";
    range.textContent = ev.start + "–" + ev.end;
    const body = document.createElement("div");
    body.className = "body";
    const ph = document.createElement("span");
    ph.className = "ph";
    ph.textContent = phaseOf(ev.text);
    body.appendChild(ph);
    body.appendChild(document.createTextNode(ev.text));
    const stChip = document.createElement("span");
    stChip.className = "status " + st;
    stChip.textContent = statusText(st);
    const act = document.createElement("div");
    act.className = "act";
    if (st === "todo"){
      const ok = document.createElement("button");
      ok.type = "button"; ok.className = "done-btn";
      ok.textContent = "✓ 完成";
      ok.addEventListener("click", function(){ markEv(dateStr, i, "done"); });
      const no = document.createElement("button");
      no.type = "button"; no.className = "no-btn";
      no.textContent = "未完成";
      no.addEventListener("click", function(){ markEv(dateStr, i, "no"); });
      act.appendChild(ok); act.appendChild(no);
    } else if (st === "done" || st === "no"){
      const undo = document.createElement("button");
      undo.type = "button"; undo.className = "tiny";
      undo.textContent = "撤销";
      undo.addEventListener("click", function(){ delete marks[evId(dateStr, i)]; saveMarks(); renderAll(); });
      act.appendChild(undo);
    }
    li.appendChild(range);
    li.appendChild(body);
    li.appendChild(stChip);
    li.appendChild(act);
    list.appendChild(li);
  });
}

function markEv(dateStr, i, s){
  marks[evId(dateStr, i)] = {s:s, t:new Date().toISOString()};
  saveMarks();
  renderAll();
}

function renderStats(nowMin){
  const dateStr = dateKey(viewDate);
  const evs = dayEvents(dateStr);
  const done = dayDoneCount(dateStr);
  const todoCnt = evs.filter(function(ev){ return statusOf(ev, dateStr, nowMin) === "todo"; }).length;
  $("stDone").textContent = done + "/" + evs.length;
  $("stTodo").textContent = todoCnt ? "待打卡 " + todoCnt + " 项" : "";
  $("barDone").style.width = evs.length ? (done / evs.length * 100) + "%" : "0%";
  let total = 0, tdone = 0, cum = 0;
  SCHEDULE.days.forEach(function(day){
    day.events.forEach(function(ev, i){
      total++;
      const m = marks[evId(day.date, i)];
      if (m && m.s === "done"){ tdone++; cum++; }
    });
  });
  $("stTotal").textContent = tdone + "/" + total;
  $("stTotalPct").textContent = total ? Math.round(tdone / total * 100) + "%" : "";
  $("stCum").textContent = cum;
  $("stStreak").textContent = streakDays() + " 天";
  const day = getDay(dateStr);
  $("stDate") && ($("stDate").textContent = dateStr.slice(5).replace("-", "."));
}

function renderCalendar(){
  const grid = $("calGrid");
  grid.innerHTML = "";
  const todayStr = dateKey(new Date());
  SCHEDULE.days.forEach(function(day){
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cell";
    const evs = day.events;
    if (!evs.length){
      btn.classList.add("rest");
      btn.innerHTML = "<div class='d'>" + day.date.slice(5).replace("-", ".") + "</div><div class='c'>休</div>";
    } else {
      const done = dayDoneCount(day.date);
      if (done === evs.length) btn.classList.add("full");
      else if (done > 0) btn.classList.add("part");
      btn.innerHTML = "<div class='d'>" + day.date.slice(5).replace("-", ".") + "</div><div class='c'>" + done + "/" + evs.length + "</div>";
    }
    if (day.date === todayStr) btn.classList.add("cur");
    btn.setAttribute("aria-label", day.date + " 完成 " + dayDoneCount(day.date) + "/" + evs.length);
    btn.addEventListener("click", function(){ viewDate = parseKey(day.date); renderAll(); });
    grid.appendChild(btn);
  });
}

function renderLog(){
  const list = $("logList");
  const empty = $("logEmpty");
  list.innerHTML = "";
  const rows = [];
  Object.keys(marks).forEach(function(k){
    const m = marks[k];
    const p = k.split("-");
    const dateStr = p[0] + "-" + p[1] + "-" + p[2];
    const idx = Number(p[3]);
    const ev = dayEvents(dateStr)[idx];
    if (!ev) return;
    rows.push({date:dateStr, idx:idx, t:m.t, s:m.s, ev:ev});
  });
  rows.sort(function(a, b){ return (b.t || "") < (a.t || "") ? -1 : (b.t || "") > (a.t || "") ? 1 : 0; });
  if (!rows.length){
    list.hidden = true;
    empty.hidden = false;
    return;
  }
  list.hidden = false;
  empty.hidden = true;
  rows.slice(0, 40).forEach(function(r){
    const li = document.createElement("li");
    li.className = "log-row";
    const tm = document.createElement("span");
    tm.className = "log-time";
    if (r.t){
      const dt = new Date(r.t);
      tm.textContent = r.date.slice(5).replace("-", ".") + " " + pad2(dt.getHours()) + ":" + pad2(dt.getMinutes());
    } else {
      tm.textContent = r.date.slice(5).replace("-", ".") + " 已记录";
    }
    const tx = document.createElement("span");
    tx.className = "log-txt";
    tx.textContent = phaseOf(r.ev.text) + " · " + r.ev.text;
    const st = document.createElement("span");
    st.className = r.s === "done" ? "log-ok" : "log-no";
    st.textContent = r.s === "done" ? "✓ 完成" : "未完成";
    li.appendChild(tm);
    li.appendChild(tx);
    li.appendChild(st);
    list.appendChild(li);
  });
}

function renderAll(){
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  $("time").textContent = fmtClock(now);
  $("date").textContent = fmtDateCn(now);
  const dateStr = dateKey(viewDate);
  $("curDay").textContent = dateStr.slice(0, 4) + "." + dateStr.slice(5, 7) + "." + dateStr.slice(8);
  $("datePick").value = dateStr;
  $("listTitle").textContent = dateStr === dateKey(new Date()) ? "今日任务" : dateStr + " 的任务";
  renderNow(nowMin);
  renderTasks(nowMin);
  renderStats(nowMin);
  renderCalendar();
  renderLog();
}

function exportData(){
  const payload = {version:2, exportedAt:new Date().toISOString(), marks:marks};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "408checkin-backup-" + dateKey(new Date()) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function importData(file){
  const reader = new FileReader();
  reader.onload = function(){
    try {
      const obj = JSON.parse(String(reader.result));
      const incoming = normalize(obj.marks || obj);
      const before = Object.keys(marks).length;
      Object.keys(incoming).forEach(function(k){ marks[k] = incoming[k]; });
      saveMarks();
      renderAll();
      alert("导入成功：新增/更新 " + Object.keys(incoming).length + " 条记录（原有 " + before + " 条已保留）。");
    } catch(e){
      alert("导入失败：文件格式不正确。");
    }
  };
  reader.readAsText(file);
}

marks = loadMarks();
pruneMarks();

$("prevDay").addEventListener("click", function(){
  viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate() - 1);
  renderAll();
});
$("nextDay").addEventListener("click", function(){
  viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate() + 1);
  renderAll();
});
$("todayBtn").addEventListener("click", function(){ viewDate = new Date(); renderAll(); });
$("datePick").addEventListener("change", function(){
  const v = this.value;
  if (v) viewDate = parseKey(v);
  renderAll();
});
$("exportBtn").addEventListener("click", exportData);
$("importBtn").addEventListener("click", function(){ $("importFile").click(); });
$("importFile").addEventListener("change", function(){
  if (this.files && this.files[0]) importData(this.files[0]);
  this.value = "";
});

renderAll();
setInterval(function(){
  const now = new Date();
  $("time").textContent = fmtClock(now);
  $("date").textContent = fmtDateCn(now);
  renderNow(now.getHours() * 60 + now.getMinutes());
}, 1000);
setInterval(function(){
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  renderTasks(nowMin);
  renderStats(nowMin);
}, 15000);
</script>
